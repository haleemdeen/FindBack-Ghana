<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | FindBack Ghana</title>

    <link rel="stylesheet" href="admin-login.css">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="logo">
                <h1>FindBack <span>Ghana</span></h1>
                <p>Lost and Found Platform</p>
            </div>

            <div class="login-heading">
                <h2>Admin Login</h2>
                <p>Sign in to manage FindBack Ghana.</p>
            </div>

            <form id="adminLoginForm">

                <div class="form-group">
                    <label for="adminEmail">Email Address</label>

                    <input type="email" id="adminEmail" placeholder="Enter admin email" required>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>

                    <input type="password" id="adminPassword" placeholder="Enter your password" required>
                </div>

                <p id="loginMessage" role="alert"></p>

                <button type="submit" id="loginButton">
                    Login to Dashboard
                </button>

            </form>

            <p class="back-link">
                <a href="land.html">← Back to FindBack Ghana</a>
            </p>

            <p class="login-footer">
                FindBack Ghana Admin Portal
            </p>

        </div>

    </main>

    <script src="admin-login.js"></script>

</body>

</html>
