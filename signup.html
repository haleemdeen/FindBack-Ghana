<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FindBack Ghana</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="body">
    <section class="form-page-sign">
        <form id="signupForm">
            <div class="container">
                <div class="mes">
                    <div>
                        <h3>FindBack Ghana</h3>
                        <button type="button" onclick="window.location.href='land.html'">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                    <h2>Create an account</h2>
                    <p>Create an account to report and explore lost and found items.</p>
                </div>

                <div class="inputes">
                    <label for="fullName">Full Name</label><br>
                    <input type="text" id="fullName" placeholder="Your full name" required><br>

                    <label for="signupEmail">Email</label><br>
                    <input type="email" id="signupEmail" placeholder="you@example.com" required><br>

                    <label for="signupContact">Contact</label><br>
                    <input type="tel" id="signupContact" placeholder="0500-000-000" required><br>

                    <label for="signupPassword">Password</label><br>
                    <input type="password" id="signupPassword" placeholder="Create a password" required minlength="6"><br>

                    <label for="confirmPassword">Confirm Password</label><br>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required minlength="6"><br>

                    <button type="submit">Create Account</button>
                    <p id="signupMessage" role="status"></p>
                </div>

                <div class="dont-have">
                    <p>Already have an account? <a href="login.html">Log in.</a></p>
                </div>
            </div>
        </form>
    </section>

    <script src="signup.js"></script>
</body>

</html>
