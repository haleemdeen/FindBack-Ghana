<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FindBack Ghana</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="body">

    <section class="form-page">
        <form id="loginForm">
            <div class="container">
                <div class="mes">
                    <h3>FindBack Ghana</h3>
                    <h2>Log in</h2>
                    <p>Log in to access your FindBack Ghana account.</p>
                </div>

                <div class="inputes">
                    <label for="loginEmail">Email</label><br>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required><br>

                    <label for="loginPassword">Password</label><br>
                    <input type="password" id="loginPassword" placeholder="*******" required><br>

                    <button type="submit">Login</button>
                    <p id="loginMessage" role="status"></p>
                </div>

                <div class="dont-have">
                    <p>Don't have an account? <a href="signup.html">Sign up.</a></p>
                </div>
            </div>
        </form>

        <script src="login.js"></script>
    </section>




</body>

</html>
